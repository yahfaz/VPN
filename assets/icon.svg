<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App background gradient: deep navy → teal-blue, matching the UI accent palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5A4"/>
      <stop offset="55%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <!-- Subtle highlight on the shield -->
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F7F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0A1428" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- Shield -->
  <g filter="url(#soft)">
    <path d="M512 196
             L760 300
             V520
             C760 690 648 792 512 850
             C376 792 264 690 264 520
             V300
             Z"
          fill="url(#shield)"/>
  </g>

  <!-- Surf wave inside the shield (the "Surf" in SurfVPN) -->
  <g fill="none" stroke-linecap="round">
    <path d="M330 560
             C390 510 430 610 512 560
             C594 510 634 610 694 560"
          stroke="#0EA5A4" stroke-width="46"/>
    <path d="M330 470
             C390 420 430 520 512 470
             C594 420 634 520 694 470"
          stroke="#1E88E5" stroke-width="46"/>
    <path d="M362 650
             C414 608 450 692 512 650
             C574 608 610 692 662 650"
          stroke="#1B2A4A" stroke-width="40" opacity="0.85"/>
  </g>
</svg>
